<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অভিযোগ ও পরামর্শ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#475569">
<link rel="icon" href="zapai.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--pri:#475569;--pri2:#64748b;--soft:#f8fafc;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bad:#dc2626}
  body.zapai{--pri:#e8860c;--pri2:#ff9a1f;--soft:#fff7ed}
  body.kido{--pri:#0284c7;--pri2:#00a3e8;--soft:#f0f9ff}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hind Siliguri","Inter",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--soft),#fff 55%);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
  .hero{text-align:center;padding:10px 0 18px}
  .blogo{display:block;margin:0 auto;height:76px;width:auto}
  .blogo.kido{height:62px}
  .brands .pick img{height:46px;width:auto;display:block;margin:0 auto}
  .brands .pick img.kido{height:38px;margin-top:4px}
  .logo{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--pri);color:#fff;font:800 28px Inter,sans-serif;box-shadow:0 10px 30px color-mix(in srgb,var(--pri) 35%,transparent)}
  h1{font-size:24px;margin:12px 0 4px}
  .sub{color:var(--mute);margin:0;font-size:15px;line-height:1.5}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 20px rgba(15,23,42,.05);margin-top:14px}
  label{display:block;font-weight:600;font-size:14.5px;margin:14px 0 6px}
  label:first-child{margin-top:0}
  .opt{color:var(--mute);font-weight:400;font-size:12.5px}
  input,textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
  input:focus,textarea:focus{border-color:var(--pri)}
  textarea{min-height:130px;resize:vertical;line-height:1.5}
  .brands,.kinds{display:grid;gap:8px}
  .brands{grid-template-columns:1fr 1fr}
  .kinds{grid-template-columns:repeat(3,1fr)}
  .pick{border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;background:#fff;font:inherit;font-size:13.5px;color:var(--ink);line-height:1.25}
  .pick .e{display:block;font-size:24px;margin-bottom:4px}
  .pick.on{border-color:var(--pri);background:var(--soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent);font-weight:600}
  .brands .pick{font:700 18px Inter,sans-serif;padding:16px}
  .photos{display:flex;gap:8px;flex-wrap:wrap}
  .ph{position:relative;width:78px;height:78px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px;line-height:1}
  .addph{width:78px;height:78px;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mute);cursor:pointer;font-size:12px;text-align:center;background:#fff}
  .btn{width:100%;margin-top:18px;border:0;border-radius:14px;padding:15px;font:700 17px "Hind Siliguri",sans-serif;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));cursor:pointer;box-shadow:0 8px 24px color-mix(in srgb,var(--pri) 30%,transparent)}
  .btn:disabled{opacity:.6;cursor:wait}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .done{text-align:center;padding:30px 18px}
  .done .big{font-size:56px}
  .ticket{display:inline-block;font:800 26px Inter,sans-serif;letter-spacing:1px;background:var(--soft);color:var(--pri);border-radius:12px;padding:8px 18px;margin:10px 0}
  .foot{text-align:center;color:var(--mute);font-size:12.5px;margin-top:22px}
  .lang{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:600 13px Inter,sans-serif;cursor:pointer;color:var(--mute)}
  @media (max-width:380px){.kinds{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<button class="lang" id="lang">English</button>
<div class="wrap" id="app"></div>
<script>
const sb = supabase.createClient("https://gmuehshdjujwisedlzjf.supabase.co", "sb_publishable_6luAFfBFqhNTeXAfsz96hg_99ZjLbFx");
const T = {
  bn: { title: "অভিযোগ ও পরামর্শ", sub: "আপনার মতামত আমাদের কাছে খুব গুরুত্বপূর্ণ। যেকোনো সমস্যা বা পরামর্শ নিচে লিখুন — আমরা দ্রুত যোগাযোগ করব।", brand: "কোন ব্র্যান্ডের বিষয়ে?", kind: "কী বিষয়ে লিখছেন?",
    k: { complaint: "অভিযোগ", size: "সাইজের সমস্যা", return: "ফেরত / বদল", suggestion: "পরামর্শ", praise: "প্রশংসা", other: "অন্যান্য" },
    name: "আপনার নাম", phone: "মোবাইল নম্বর", phoneHint: "যেমন: 01XXXXXXXXX", order: "অর্ডার নম্বর", msg: "আপনার কথা লিখুন", msgHint: "কী হয়েছে, কোন পণ্য, কোন সাইজ — বিস্তারিত লিখুন", photos: "ছবি", addph: "ছবি যোগ করুন", opt: "(ঐচ্ছিক)",
    send: "পাঠান", sending: "পাঠানো হচ্ছে…", thanks: "ধন্যবাদ!", got: "আপনার বার্তা আমরা পেয়েছি। টিকিট নম্বরটা রেখে দিন:", soon: "আমাদের টিম শিগগিরই আপনার নম্বরে যোগাযোগ করবে।", again: "আরেকটা পাঠান", pickBrand: "ব্র্যান্ড বাছুন", pickKind: "কী বিষয়ে লিখছেন বাছুন", foot: "আপনার তথ্য শুধু আমাদের টিম দেখবে।", max3: "সর্বোচ্চ ৩টা ছবি দেওয়া যাবে" },
  en: { title: "Complaints & Suggestions", sub: "Your feedback matters to us. Tell us about any problem or idea below — we'll get back to you soon.", brand: "Which brand?", kind: "What is it about?",
    k: { complaint: "Complaint", size: "Size problem", return: "Return / exchange", suggestion: "Suggestion", praise: "Praise", other: "Other" },
    name: "Your name", phone: "Mobile number", phoneHint: "e.g. 01XXXXXXXXX", order: "Order number", msg: "Your message", msgHint: "What happened, which product, which size — please give details", photos: "Photos", addph: "Add photo", opt: "(optional)",
    send: "Send", sending: "Sending…", thanks: "Thank you!", got: "We've received your message. Please keep your ticket number:", soon: "Our team will contact you on your number soon.", again: "Send another", pickBrand: "Please choose a brand", pickKind: "Please choose what it is about", foot: "Only our team can see your information.", max3: "Up to 3 photos" },
};
const KE = { complaint: "😠", size: "📏", return: "🔁", suggestion: "💡", praise: "⭐", other: "💬" };
const qs = new URLSearchParams(location.search);
const host = location.hostname.toLowerCase();
const fixed = /kido/.test(qs.get("b") || "") || /kido/.test(host) ? "Kido" : /zapai/.test(qs.get("b") || "") ? "Zapai" : null;
let L = localStorage.getItem("fb_lang") || "bn";
const st = { brand: fixed, kind: qs.get("k") && KE[qs.get("k")] ? qs.get("k") : null, name: "", phone: "", order: qs.get("o") || "", msg: "", photos: [] };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LOGO = { Zapai: "zapai.png", Kido: "kido.png" };
function theme() {
  document.body.classList.toggle("kido", st.brand === "Kido"); document.body.classList.toggle("zapai", st.brand === "Zapai");
  document.querySelector('meta[name=theme-color]').content = st.brand === "Kido" ? "#0284c7" : st.brand === "Zapai" ? "#e8860c" : "#475569";
  let fi = document.querySelector('link[rel=icon]'); if (!fi) { fi = document.createElement("link"); fi.rel = "icon"; document.head.appendChild(fi); }
  fi.href = st.brand === "Kido" ? "kido.png" : "zapai.png";
}
const logoHtml = () => st.brand ? `<img class="blogo ${st.brand.toLowerCase()}" src="${LOGO[st.brand]}" alt="${st.brand}">` : `<div class="logo">💬</div>`;
function form() {
  const t = T[L]; theme();
  document.documentElement.lang = L; document.title = t.title + (st.brand ? " — " + st.brand : "");
  document.getElementById("lang").textContent = L === "bn" ? "English" : "বাংলা";
  document.getElementById("app").innerHTML = `
  <div class="hero">${logoHtml()}<h1>${t.title}</h1><p class="sub">${t.sub}</p></div>
  <form class="card" id="f" novalidate>
    ${fixed ? "" : `<label>${t.brand}</label><div class="brands">${["Zapai", "Kido"].map(b => `<button type="button" class="pick ${st.brand === b ? "on" : ""}" data-b="${b}"><img class="${b.toLowerCase()}" src="${LOGO[b]}" alt="${b}"></button>`).join("")}</div>`}
    <label>${t.kind}</label>
    <div class="kinds">${Object.keys(KE).map(k => `<button type="button" class="pick ${st.kind === k ? "on" : ""}" data-k="${k}"><span class="e">${KE[k]}</span>${t.k[k]}</button>`).join("")}</div>
    <label for="nm">${t.name} <span class="opt">${t.opt}</span></label><input id="nm" autocomplete="name" value="${esc(st.name)}">
    <label for="ph">${t.phone}</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="${t.phoneHint}" value="${esc(st.phone)}">
    <label for="od">${t.order} <span class="opt">${t.opt}</span></label><input id="od" value="${esc(st.order)}">
    <label for="ms">${t.msg}</label><textarea id="ms" placeholder="${t.msgHint}">${esc(st.msg)}</textarea>
    <label>${t.photos} <span class="opt">${t.opt}</span></label>
    <div class="photos">${st.photos.map((p, i) => `<div class="ph"><img src="${p}" alt=""><button type="button" data-rm="${i}">✕</button></div>`).join("")}${st.photos.length < 3 ? `<label class="addph" style="margin:0;font-weight:400">📷<br>${t.addph}<input type="file" accept="image/*" multiple hidden id="pf"></label>` : ""}</div>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn" id="send" type="submit">${t.send}</button>
    <div class="err" id="err"></div>
  </form>
  <p class="foot">🔒 ${t.foot}</p>`;
  const $ = (s) => document.querySelector(s);
  const keep = () => { st.name = $("#nm").value; st.phone = $("#ph").value; st.order = $("#od").value; st.msg = $("#ms").value; };
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { keep(); st.brand = b.dataset.b; form(); });
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { keep(); st.kind = b.dataset.k; form(); });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { keep(); st.photos.splice(+b.dataset.rm, 1); form(); });
  const pf = $("#pf");
  if (pf) pf.onchange = async () => {
    keep();
    for (const f of [...pf.files]) { if (st.photos.length >= 3) { alert(t.max3); break; } try { st.photos.push(await shrink(f)); } catch {} }
    form();
  };
  $("#f").onsubmit = async (e) => {
    e.preventDefault(); keep();
    const err = $("#err"); err.textContent = "";
    if (!st.brand) { err.textContent = t.pickBrand; return; }
    if (!st.kind) { err.textContent = t.pickKind; return; }
    const b = $("#send"); b.disabled = true; b.textContent = t.sending;
    const { data, error } = await sb.rpc("pl_submit_feedback", { p_brand: st.brand, p_kind: st.kind, p_name: st.name, p_phone: st.phone, p_order: st.order, p_message: st.msg, p_photos: st.photos, p_hp: $("#hp").value });
    if (error) { err.textContent = (error.message || "").replace(/^.*?: /, "") || "Error"; b.disabled = false; b.textContent = t.send; return; }
    done(data);
  };
}
function done(ticket) {
  const t = T[L];
  document.getElementById("app").innerHTML = `<div class="hero">${logoHtml()}</div>
  <div class="card done"><div class="big">✅</div><h1>${t.thanks}</h1><p class="sub">${t.got}</p><div class="ticket">${esc(ticket)}</div><p class="sub">${t.soon}</p>
  <button class="btn" id="again">${t.again}</button></div>`;
  document.getElementById("again").onclick = () => { Object.assign(st, { kind: null, msg: "", order: "", photos: [] }); form(); };
}
// ছবি ছোট করা (সর্বোচ্চ ১২০০px, JPEG)
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let q = 0.75, m = 1200, out;
      for (let k = 0; k < 4; k++) {
        const r = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 600000) break;
        m = Math.round(m * 0.75); q = Math.max(0.5, q - 0.1);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = rej; img.src = url;
  });
}
document.getElementById("lang").onclick = () => { L = L === "bn" ? "en" : "bn"; try { localStorage.setItem("fb_lang", L); } catch {} const f = document.getElementById("f"); if (f) { st.name = nm.value; st.phone = ph.value; st.order = od.value; st.msg = ms.value; form(); } else form(); };
form();
</script>
</body>
</html>
