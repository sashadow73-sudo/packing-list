<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্যাকিং লিস্ট — Zapai & Kido</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="প্যাকিং লিস্ট">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--pri:#0f766e;--pri2:#0d9488;--warn:#b45309;--bad:#b91c1c;--r:10px}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1}
  header .who{font-size:13px;opacity:.9}
  nav{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap;color:var(--mute)}
  nav button.on{background:#e6f4f1;color:var(--pri);font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:15px;margin:16px 0 8px}
  label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .btn{font:inherit;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--pri);color:#fff}
  .btn:hover{background:var(--pri2)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.bad{background:#fff;color:var(--bad);border:1px solid #fecaca}
  .btn.sm{padding:5px 9px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:wait}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sp{flex:1}
  .mute{color:var(--mute);font-size:13px}
  .err{color:var(--bad);font-size:14px;margin-top:8px;white-space:pre-wrap}
  .ok{color:var(--pri);font-size:14px;margin-top:8px}
  .warnbox{background:#fffbeb;border:1px solid #fde68a;color:var(--warn);padding:10px;border-radius:8px;font-size:13px;margin:8px 0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
  th{background:#f9fafb;font-weight:600;font-size:13px}
  td.n,th.n{text-align:right;white-space:nowrap}
  .tw{overflow-x:auto}
  table.edit input{padding:5px 6px;font-size:13px;min-width:60px}
  .lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .lot{cursor:pointer}
  .lot:hover{border-color:var(--pri)}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2ff;color:#3730a3}
  .tag.ordered{background:#fef3c7;color:#92400e}.tag.shipped{background:#dbeafe;color:#1e40af}.tag.arrived{background:#dcfce7;color:#166534}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{height:80px;border-radius:6px;border:1px solid var(--line)}
  .drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;background:#fafafa}
  .drop.hot{border-color:var(--pri);background:#f0fdfa}
  .center{max-width:380px;margin:60px auto}
  .print-only{display:none}
  .totals{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-size:14px}
  .totals b{font-size:16px}
  @media print{
    header,nav,.no-print,.btn{display:none!important}
    body{background:#fff;font-size:12px}
    main{padding:0;max-width:none}
    .card{border:0;padding:0;margin:0 0 10px}
    .print-only{display:block}
    th,td{border:1px solid #999;padding:4px}
    th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hide-print{display:none!important}
  }
  .pwwrap{position:relative;display:block}
  .pwwrap input{padding-right:64px}
  .pwtog{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--pri);cursor:pointer;user-select:none;padding:4px 6px;border-radius:6px}
  .pwtog:hover{background:#e6f4f1}

  /* ===== আধুনিক থিম ===== */
  :root{--bg:#f3f5f8;--line:#e6e9ef;--pri:#0f766e;--pri2:#0d9488;--r:14px;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);--side:248px}
  body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}
  .card{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
  input,select,textarea{border-radius:10px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri2);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  .btn{border-radius:10px;font-weight:500;transition:background .15s,transform .05s}
  .btn:active{transform:translateY(1px)}
  .shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
  .side{background:linear-gradient(180deg,#0b3d3a 0%,#0f766e 100%);color:#e6fffb;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;z-index:30}
  .brand-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-size:19px;font-weight:700;color:#fff}
  .brand-logo .lg{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px}
  .brand-logo small{display:block;font-size:12px;font-weight:400;opacity:.75}
  .side .nav{display:flex;flex-direction:column;gap:4px}
  .side .nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:#cdeee9;font:inherit;font-size:15px;padding:11px 12px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
  .side .nav button .ic{width:22px;text-align:center;font-size:17px}
  .side .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .side .nav button.on{background:#fff;color:var(--pri);font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .side .me{margin-top:auto;background:rgba(255,255,255,.1);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
  .side .av{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
  .side .me .nm{font-size:14px;font-weight:600;color:#fff;line-height:1.2}
  .side .me .rl{font-size:12px;opacity:.8}
  .side .out{margin-top:10px;width:100%;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:9px;font:inherit;cursor:pointer}
  .side .out:hover{background:rgba(255,255,255,.2)}
  .content{min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 24px;background:rgba(243,245,248,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
  .topbar h1{font-size:21px;margin:0;font-weight:700;flex:1}
  .topbar .date{color:var(--mute);font-size:13px}
  .hamb{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
  main{max-width:1200px;width:100%;margin:0;padding:22px 24px}
  .scrim{display:none}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;gap:12px;align-items:center}
  .stat .si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
  .stat .sv{font-size:24px;font-weight:700;line-height:1.1}
  .stat .sl{font-size:13px;color:var(--mute)}
  .si.t1{background:#ccfbf1}.si.t2{background:#e0e7ff}.si.t3{background:#fef3c7}.si.t4{background:#dbeafe}.si.t5{background:#dcfce7}
  .brandbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:18px}
  .bcard{border-radius:var(--r);padding:16px 18px;color:#fff;box-shadow:var(--sh)}
  .bcard.zapai{background:linear-gradient(135deg,#0f766e,#14b8a6)}
  .bcard.kido{background:linear-gradient(135deg,#7c3aed,#c084fc)}
  .bcard .bn{font-size:17px;font-weight:700}.bcard .bx{opacity:.9;font-size:14px;margin-top:4px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--sh);margin-bottom:16px}
  .toolbar input{flex:1;min-width:180px;border:0;background:#f6f7f9}
  .toolbar select{width:auto;border:0;background:#f6f7f9}
  .lots{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .lot{position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s;padding:16px 16px 14px 20px}
  .lot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pri)}
  .lot.kido::before{background:#8b5cf6}
  .lot:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.1)}
  .lot .ln{font-size:18px;font-weight:700}
  .lot .meta{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
  .lot .meta b{font-size:16px}
  .bchip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:#ccfbf1;color:#0f766e}
  .bchip.kido{background:#ede9fe;color:#6d28d9}
  .tag{font-weight:600}
  .empty{text-align:center;padding:40px 16px;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
  .empty .ei{font-size:40px;margin-bottom:6px}
  /* login */
  .authbg{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#99f6e4 0,transparent 40%),radial-gradient(circle at 90% 90%,#ddd6fe 0,transparent 45%),var(--bg)}
  .authbg .center{margin:0;width:100%;max-width:400px;padding:28px}
  .authbg .center h2{font-size:22px;text-align:center}
  .authbg .center .btn{padding:11px}
  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;width:var(--side);transform:translateX(-100%);transition:transform .2s}
    .shell.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
    .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
    .hamb{display:grid;place-items:center}
    .topbar{padding:12px 14px}.topbar .date{display:none}
    main{padding:14px}
  }
  @media print{ .side,.topbar,.scrim{display:none!important} .shell{display:block} .card{box-shadow:none} }
  .langsw{display:inline-flex;background:#eef1f5;border-radius:10px;padding:3px;gap:2px}
  .langsw button{border:0;background:none;font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer;color:var(--mute)}
  .langsw button.on{background:#fff;color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .langsw.dark{background:rgba(255,255,255,.12);display:flex}
  .langsw.dark button{flex:1;color:#cdeee9}
  .langsw.dark button.on{background:#fff;color:var(--pri)}
  .authbg .langsw{display:flex;width:max-content;margin:-6px auto 14px}
  .lots .card{margin:0}
  .pimg{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in;background:#f6f7f9}
  .pimg.sm{width:40px;height:40px}
  .pimg.ph{display:grid;place-items:center;color:var(--mute);font-size:20px;cursor:pointer}
  .imgcell{position:relative;width:56px}
  .imgcell .x{position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;font-size:11px;line-height:18px;text-align:center;cursor:pointer}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:100;cursor:zoom-out}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;background:#fff}
  @media print{.pimg{width:42px;height:42px;border-radius:4px}}
  @media (max-width:860px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px}.stat .sv{font-size:20px}}
  .chk-col,.chk-only{display:none}
  body.chkprint .chk-col{display:table-cell;min-width:70px}
  body.chkprint .chk-only{display:block;margin-top:14px}
  body.chkprint .rcv-col, body.chkprint .rcv-only{display:none!important}
  @media print{ body.chkprint .chk-col{border:1px solid #555;min-width:80px} body.chkprint h3, body.chkprint h3 + .tw{display:none} body.chkprint tr{page-break-inside:avoid} }
  #psave:empty{display:none!important}
  .ltabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:14px;box-shadow:var(--sh);overflow-x:auto}
  .ltabs button{flex:1;min-width:max-content;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--mute);padding:11px 16px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
  .ltabs button:hover{background:#f3f5f8;color:var(--ink)}
  .ltabs button.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.25)}
  .bigin{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:14px}
  .bigin label{font-size:14px;color:var(--ink);font-weight:600}
  .bigin input{font-size:20px;font-weight:700;padding:10px 12px}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .stepper button{border:0;background:#f3f4f6;width:30px;height:34px;font-size:18px;cursor:pointer;color:var(--ink)}
  .stepper button:hover{background:#e6f4f1;color:var(--pri)}
  .stepper input{border:0;border-radius:0;width:56px;text-align:center;padding:6px 2px}
  .mgnote{font-size:11px;text-align:center}
  .stepper.off{opacity:.4}
  #ptab tr.galt td{background:#f8fafc}
  .c-bd{font-size:10.5px;line-height:1.3;margin-top:2px;white-space:nowrap}
  .pc{display:inline-block;padding:2px 8px;border-radius:99px;font-weight:600}
  .pc.low{background:#fee2e2;color:#b91c1c}.pc.mid{background:#fef3c7;color:#92400e}.pc.good{background:#dcfce7;color:#166534}
  .stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .stabs button{border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--mute);padding:9px 14px;border-radius:99px;cursor:pointer}
  .stabs button .cnt{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:99px;background:#eef1f5;color:var(--ink);font-size:12px}
  .stabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stabs button.on .cnt{background:rgba(255,255,255,.2);color:#fff}
  .lockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .rb.lockb{background:#334155;color:#fff}
  .staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .emp{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
  .emp.off{opacity:.65}
  .emp-top{display:flex;gap:10px;align-items:center}
  .av2{width:38px;height:38px;border-radius:50%;background:#ccfbf1;color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
  .emp-nm{flex:1;min-width:0;line-height:1.3}.emp-nm .mute{font-size:12.5px}
  .emp-mid{display:flex;gap:6px;align-items:center;margin:10px 0;font-size:14px}
  .emp-mid select{width:auto;padding:4px 8px}
  .emp-act{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
  .rolehelp{margin-top:10px}.rolehelp summary{cursor:pointer;color:var(--pri);font-size:14px}.rolehelp .mute{margin-top:6px;font-size:13px}
  .fab{display:none}
  .edgrid .full{grid-column:1 / -1}
  /* মোবাইলে কম জায়গায় গোছানো ড্যাশবোর্ড */
  @media (max-width:860px){
    .topbar{padding:8px 12px}.topbar h1{font-size:18px}.hamb{width:36px;height:36px;font-size:18px}
    main{padding:10px 12px 90px}
    .stats{display:flex;overflow-x:auto;gap:8px;margin:0 0 10px;padding:2px 0 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
    .stats::-webkit-scrollbar{display:none}
    .stat{flex:0 0 30%;min-width:104px;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px;scroll-snap-align:start;border-radius:12px}
    .stat .si{width:30px;height:30px;font-size:16px;border-radius:9px}
    .stat .sv{font-size:19px}.stat .sl{font-size:11.5px;white-space:nowrap}
    .brandbar{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .bcard{padding:10px 12px;border-radius:12px}.bcard .bn{font-size:15px}.bcard .bx{font-size:12px;margin-top:2px}
    .stabs{flex-wrap:nowrap;overflow-x:auto;margin:0 0 10px;padding:0 0 2px;scrollbar-width:none}
    .stabs::-webkit-scrollbar{display:none}
    .stabs button{flex:0 0 auto;font-size:13px;padding:7px 12px}
    .toolbar{padding:8px;gap:8px;margin-bottom:10px}
    .toolbar input{flex:1 1 100%;min-width:0}
    .toolbar select{flex:1;min-width:0;font-size:14px}
    #newlot{display:none}
    .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 20px rgba(15,118,110,.4);z-index:15;cursor:pointer}
    .lots{gap:10px}.lot{padding:12px 12px 10px 16px}.lot .ln{font-size:16px}.lot .meta{margin-top:8px;padding-top:8px}
    .ltabs button{font-size:13.5px;padding:9px 10px}
    .edh{font-size:16px;margin:0 0 10px}
    .card{padding:14px}
    .edgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
    .edgrid .full{grid-column:1 / -1}
    .edgrid label{font-size:12.5px;margin-bottom:3px}
    .edgrid input,.edgrid select{padding:8px 10px;font-size:15px}
    .xlbar{padding:10px;gap:8px}
    .xlbar .btn{flex:1;text-align:center;padding:10px 8px}
    .xlhint{flex-basis:100%;font-size:12px}
    .drop{padding:14px 10px;font-size:14px}
    .upcard .row label{font-size:13px}
  }
  @media print{.fab{display:none!important}}
  .xlbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:12px;margin-bottom:12px}
  .xlbar a.btn{text-decoration:none}
  .pgs{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .pg{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}

// ---------- pricing ----------
// খরচ/পিস = ইউয়ান দাম × রেট + (ওজন গ্রাম ÷ ১০০০ × প্রতি কেজি শিপিং) + অন্যান্য খরচের ভাগ
function pricing(items, costs, lotCost, settings, received) {
  const rate = lotCost?.cny_rate ?? settings.cny_rate;
  const perKg = lotCost?.shipping_per_kg ?? settings.shipping_per_kg;
  const margin = lotCost?.margin_pct ?? settings.margin_pct;
  const weight = num(lotCost?.total_weight_kg);
  const extra = num(lotCost?.extra_cost_bdt);
  const Q = (i) => received ? (i.received_qty ?? 0) : (i.line_type === "extra" ? (i.received_qty ?? 0) : num(i.qty));
  const totalQ = items.reduce((a, i) => a + Q(i), 0);
  const known = items.reduce((a, i) => { const w = costs[i.id]?.weight_g; return a + (w != null && w !== "" ? num(w) * Q(i) / 1000 : 0); }, 0);
  const noW = items.filter(i => costs[i.id]?.weight_g == null || costs[i.id]?.weight_g === "");
  const noWQ = noW.reduce((a, i) => a + Q(i), 0);
  const restKgPerPc = weight > known && noWQ ? (weight - known) / noWQ : 0;   // মোট ওজন দিলে, যাদের ওজন নেই তাদের মধ্যে ভাগ
  const extraPerPc = totalQ ? extra / totalQ : 0;
  const rows = items.map(i => {
    const c = costs[i.id] || {};
    const cny = num(c.unit_price_cny);
    const hasW = c.weight_g != null && c.weight_g !== "";
    const kgPc = hasW ? num(c.weight_g) / 1000 : restKgPerPc;
    const ship = kgPc * perKg;
    const m = c.margin_pct != null && c.margin_pct !== "" ? num(c.margin_pct) : margin;
    const cost = cny * rate + ship + extraPerPc;
    const sell = c.sell_price_override != null ? num(c.sell_price_override) : Math.ceil(cost * (1 + m / 100) / 5) * 5;
    return { item: i, q: Q(i), cny, weight_g: hasW ? num(c.weight_g) : null, kgPc, ship, margin: m, ownMargin: c.margin_pct, cost, sell, override: c.sell_price_override };
  });
  const goodsBdt = items.reduce((a, i) => a + num(costs[i.id]?.unit_price_cny) * rate * (i.line_type === "extra" ? 0 : num(i.qty)), 0); // চায়নায় যা পরিশোধ
  const shipTotal = rows.reduce((a, r) => a + r.ship * r.q, 0);
  const totalKg = rows.reduce((a, r) => a + r.kgPc * r.q, 0);
  const totalCost = goodsBdt + shipTotal + extra;
  const totalSell = rows.reduce((a, r) => a + r.sell * r.q, 0);
  return { rate, perKg, margin, weight, extra, extraPerPc, totalQ, totalKg, shipTotal, rows, goodsBdt, totalCost, totalSell, received };
}

      <tbody>${Object.entries(byProd).map(([k, v]) => `<tr><td>${prodImg[k] ? `<img class="pimg sm" src="${esc(prodImg[k])}" alt="">` : ""}</td><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("")}</tbody></table></div>
  </div>
  ${isAdmin() ? pricingHtml(P, lotCost, S.lotTab !== "price") : ""}`;

  main.querySelector("#back").onclick = () => go("lots");
  bindLotTabs(main);
  bindLock(main, lot);
  if (lot.locked) { main.querySelectorAll("#pricing input, #pricing button, #status").forEach(e => e.disabled = true); }
  if (S.lotTab === "price" && isAdmin()) main.querySelectorAll(".pl-only").forEach(e => e.style.display = "none");
  main.querySelector("#printC").onclick = () => {
    main.querySelectorAll(".price-col").forEach(e => e.style.display = "none"); main.querySelector("#pl").style.display = ""; document.getElementById("pricing")?.classList.add("hide-print");
    document.body.classList.add("chkprint"); window.print(); setTimeout(() => document.body.classList.remove("chkprint"), 500);
  };
  main.querySelector("#print").onclick = () => { main.querySelectorAll(".price-col").forEach(e => e.style.display = "none"); main.querySelector("#pl").style.display = ""; document.getElementById("pricing")?.classList.add("hide-print"); window.print(); };
  if (!isAdmin()) return;
  main.querySelector("#printP").onclick = () => { main.querySelectorAll(".price-col").forEach(e => e.style.display = ""); main.querySelector("#pl").style.display = ""; document.getElementById("pricing")?.classList.add("hide-print"); window.print(); setTimeout(() => main.querySelectorAll(".price-col").forEach(e => e.style.display = "none"), 500); };
  const eb = main.querySelector("#edit"); if (eb) eb.onclick = () => go("edit", lot.id);
  const db = main.querySelector("#del"); if (db) db.onclick = async () => {
    if (!confirm(`${lot.lot_no} — পুরোপুরি মুছে ফেলবেন?`)) return;
    await q(sb.from("pl_lots").delete().eq("id", lot.id)); go("lots");
  };
  main.querySelector("#status").onchange = async (e) => { await q(sb.from("pl_lots").update({ status: e.target.value }).eq("id", lot.id)); };
  bindPricing(main, lot, items, costs, lotCost);
}

function groupRows(rows) { const out = [], m = {}; rows.forEach(r => { const k = gkey(r.item) || r.item.id; if (!m[k]) { m[k] = { key: k, rows: [] }; out.push(m[k]); } m[k].rows.push(r); }); return out; }
const gkey = (i) => (i.product_name_cn || i.product_name || "").trim().toLowerCase();
function costBd(r, P) { return `¥${fmt(r.cny)}×${fmt(P.rate)} = ${tk(r.cny * P.rate)}<br>+ শিপিং ${tk(r.ship)}${P.extraPerPc ? ` + অন্যান্য ${tk(P.extraPerPc)}` : ""}`; }
function pcClass(r) { if (!r.cost) return ""; const p = (r.sell / r.cost - 1) * 100; return p < 10 ? "low" : p < 25 ? "mid" : "good"; }
// লাভ %-এর নিচের লেখা: নিজের দাম দিলে আসল লাভ % দেখায়
function mgNote(r) {
  if (r.override != null) return `<b style="color:${r.sell >= r.cost ? "var(--pri)" : "var(--bad)"}">নিজের দামে আসল লাভ ${r.cost ? Math.round((r.sell / r.cost - 1) * 100) : 0}%</b>`;
  return r.ownMargin != null && r.ownMargin !== "" ? "নিজস্ব" : "সাধারণ";
}

    </div>

          ${f.item.product_name_cn && f.item.product_name ? `<div class="mute">${esc(f.item.product_name_cn)}</div>` : ""}

      <tbody>${G.rows.map(r => `<tr data-id="${r.item.id}">

    <div class="row" style="margin-top:12px"><span class="mute">💾 লিখলেই নিজে থেকে সেভ হয়</span><span id="psave" class="rb ok" style="display:inline-block"></span></div>
    <p class="mute">খরচ/পিস = ইউয়ান দাম × রেট + শিপিং/পিস (ওজন × প্রতি কেজি খরচ) + অন্যান্য খরচের ভাগ। বিক্রয়মূল্য = খরচ × (১ + লাভ%), ৫ টাকায় রাউন্ড করা। কোনো পণ্যের লাভ % ফাঁকা রাখলে সাধারণ লাভ % ধরা হবে। নিজে দাম বসাতে চাইলে “নিজের দাম” ঘরে লিখুন।</p>

function bindPricing(main, lot, items, costs, lc) {
  const v = (id) => { const s = main.querySelector(id).value.trim(); return s === "" ? null : num(s); };
  const nv = (el) => { const s = el.value.trim(); return s === "" ? null : num(s); };
  // প্রতিটা লাইনের মান এখানে থাকে
  const C = {};
  items.forEach(i => { const c = costs[i.id] || {}; C[i.id] = { unit_price_cny: num(c.unit_price_cny), weight_g: c.weight_g ?? null, margin_pct: c.margin_pct ?? null, sell_price_override: c.sell_price_override ?? null }; });
  const groupIds = (pg) => [...pg.querySelectorAll("tr[data-id]")].map(tr => tr.dataset.id);
  const live = () => {
    const lc2 = { cny_rate: v("#r"), shipping_per_kg: v("#k"), margin_pct: v("#m"), extra_cost_bdt: v("#x") ?? 0, total_weight_kg: v("#w") ?? 0 };
    const P2 = pricing(items, C, lc2, S.settings, !!lot.received_at);
    const byId = Object.fromEntries(P2.rows.map(r => [r.item.id, r]));
    main.querySelectorAll(".pg").forEach(pg => {
      const ids = groupIds(pg), f = byId[ids[0]];
      pg.querySelector(".pg-bd").innerHTML = `খরচ/পিস = দাম ¥ × <b>${fmt(P2.rate)}</b> + ওজন (কেজি) × <b>${tk(P2.perKg)}</b>${P2.extraPerPc ? ` + অন্যান্য <b>${tk(P2.extraPerPc)}</b>` : ""} · প্রতিটা লাইনে আলাদা দাম আর ওজন লেখা যাবে`;
      const mg = pg.querySelector(".g-mg");
      pg.querySelector(".mg-hint").textContent = mg.value.trim() === "" ? `সাধারণ ${fmt(P2.margin)}% ধরা হচ্ছে` : "এই পণ্যের নিজস্ব লাভ";
      const wg = pg.querySelector(".g-wg");
      pg.querySelector(".wg-hint").textContent = wg.placeholder === "ভিন্ন" || wg.placeholder === "ভিন্ন ভিন্ন" ? "লাইনে আলাদা আলাদা দেওয়া আছে" : wg.value.trim() !== "" ? "" : (f && f.kgPc ? `ফাঁকা — মোট ওজন থেকে আন্দাজ ${Math.round(f.kgPc * 1000)} গ্রাম` : "ফাঁকা — শিপিং ধরা হচ্ছে না");
      pg.querySelector(".stepper").classList.toggle("off", ids.every(id => byId[id].override != null));
      ids.forEach(id => {
        const r = byId[id], tr = pg.querySelector(`tr[data-id="${id}"]`);
        tr.querySelector(".c-cost").textContent = tk(r.cost);
        tr.querySelector(".c-ship").textContent = tk(r.ship);
        const rw = tr.querySelector(".r-wg"); rw.placeholder = r.weight_g == null && r.kgPc ? "~" + Math.round(r.kgPc * 1000) : "গ্রাম";
        tr.querySelector(".c-sell").textContent = tk(r.sell);
        const ppc = tr.querySelector(".c-ppc"); ppc.textContent = tk(r.sell - r.cost); ppc.className = "c-ppc pc " + pcClass(r);
        tr.querySelector(".c-pct").textContent = r.cost ? `${Math.round((r.sell / r.cost - 1) * 100)}%${r.override != null ? " (নিজের দাম)" : ""}` : "";
        tr.querySelector(".c-prof").textContent = tk((r.sell - r.cost) * r.q);
      });
    });
    const set = (id, t) => { const el = main.querySelector(id); if (el) el.textContent = t; };
    set("#t-goods", tk(P2.goodsBdt)); set("#t-ship", tk(P2.shipTotal)); set("#t-kg", fmt(P2.totalKg)); set("#t-extra", tk(P2.extra));
    set("#t-cost", tk(P2.totalCost)); set("#t-sell", tk(P2.totalSell)); set("#t-prof", tk(P2.totalSell - P2.totalCost));
    const pf = main.querySelector("#t-prof"); if (pf) pf.style.color = P2.totalSell - P2.totalCost >= 0 ? "var(--pri)" : "var(--bad)";
    main.querySelectorAll("td.price-col").forEach((td, n) => { if (P2.rows[n]) td.textContent = tk(P2.rows[n].sell); });
  };
  // অটো সেভ
  const st = main.querySelector("#psave");
  const show = (t, cls) => { st.textContent = t; st.className = "rb " + cls; };
  let timer = null, saving = false, again = false;
  const save = async () => {
    if (saving) { again = true; return; }
    saving = true; show("⏳ সেভ হচ্ছে…", "more");
    try {
      await q(sb.from("pl_lot_costs").upsert({ lot_id: lot.id, total_weight_kg: v("#w") ?? 0, cny_rate: v("#r"), shipping_per_kg: v("#k"), margin_pct: v("#m"), extra_cost_bdt: v("#x") ?? 0 }));
      const rows = Object.entries(C).map(([id, c]) => ({ item_id: id, ...c }));
      if (rows.length) await q(sb.from("pl_item_costs").upsert(rows));
      show("✅ সেভ হয়েছে", "ok");
    } catch (err) { show("❌ সেভ হয়নি: " + err.message, "bad"); }
    saving = false;
    if (again) { again = false; save(); }
  };
  const changed = () => { live(); show("✏️ পরিবর্তন হচ্ছে…", "more"); clearTimeout(timer); timer = setTimeout(save, 1000); };
  const now = () => { clearTimeout(timer); save(); };
  // পণ্যের কার্ডের ঘর → ওই পণ্যের সব কালার/সাইজে বসে
  main.querySelectorAll(".pg").forEach(pg => {
    const ids = groupIds(pg);
    const rowCls = { unit_price_cny: ".r-cny", weight_g: ".r-wg" };
    const bind = (cls, key, extra) => { const el = pg.querySelector(cls);
      el.addEventListener("input", () => { ids.forEach(id => { C[id][key] = key === "unit_price_cny" ? (nv(el) ?? 0) : nv(el); if (extra) extra(id);
        if (rowCls[key]) { const ri = pg.querySelector(`tr[data-id="${id}"] ${rowCls[key]}`); if (ri) ri.value = el.value; } }); changed(); });
      el.addEventListener("change", now); };
    // প্রতিটা লাইনের নিজস্ব দাম আর ওজন
    const syncHead = () => {
      ["unit_price_cny", "weight_g"].forEach(key => {
        const head = pg.querySelector(key === "unit_price_cny" ? ".g-cny" : ".g-wg");
        const vals = ids.map(id => C[id][key] ?? ""), same = vals.every(x => String(x) === String(vals[0]));
        if (document.activeElement !== head) { head.value = same && vals[0] !== 0 ? vals[0] : ""; head.placeholder = same ? (key === "weight_g" ? "" : "0") : "ভিন্ন ভিন্ন"; }
      });
      const wh = pg.querySelector(".wg-hint"); if (wh && pg.querySelector(".g-wg").placeholder === "ভিন্ন ভিন্ন") wh.textContent = "লাইনে আলাদা আলাদা দেওয়া আছে";
    };
    pg.querySelectorAll("tr[data-id]").forEach(tr => {
      const id = tr.dataset.id;
      tr.querySelector(".r-cny").addEventListener("input", (e) => { C[id].unit_price_cny = nv(e.target) ?? 0; syncHead(); changed(); });
      tr.querySelector(".r-wg").addEventListener("input", (e) => { C[id].weight_g = nv(e.target); syncHead(); changed(); });
      tr.querySelectorAll(".r-cny, .r-wg").forEach(i => i.addEventListener("change", now));
    });
    bind(".g-cny", "unit_price_cny");
    bind(".g-wg", "weight_g");
    bind(".g-mg", "margin_pct", (id) => { C[id].sell_price_override = null; const o = pg.querySelector(`tr[data-id="${id}"] .ovr`); if (o) o.value = ""; });
    const inp = pg.querySelector(".g-mg");
    const bump = (d) => { const cur = inp.value.trim() === "" ? num(main.querySelector("#m").value || S.settings.margin_pct) : num(inp.value); inp.value = Math.max(0, cur + d); inp.dispatchEvent(new Event("input")); now(); };
    pg.querySelector(".st-dn").onclick = () => bump(-5);
    pg.querySelector(".st-up").onclick = () => bump(5);
    pg.querySelectorAll(".ovr").forEach(o => {
      const id = o.closest("tr").dataset.id;
      o.addEventListener("input", () => { C[id].sell_price_override = nv(o); changed(); });
      o.addEventListener("change", now);
    });
  });
  ["#r", "#k", "#m", "#x", "#w"].forEach(id => { const el = main.querySelector(id); el.addEventListener("input", changed); el.addEventListener("change", now); });
  window.onbeforeunload = () => (timer && st.textContent.startsWith("✏️")) ? "" : undefined;
  live();
}

// ---------- editor (new / edit) ----------

  const editing = S.tab === "edit";
  let lot = { lot_no: "", brand: S.me.brand || "Zapai", supplier: "", order_no: "", notes: "", status: "ordered" };

    const items = await q(sb.from("pl_lot_items").select("*").eq("lot_id", lot.id).order("position"));

  } else {
    lot.lot_no = "";
  }
  let files = [];

  main.innerHTML = `
  <div class="card upcard">

    <div class="xlbar">
      <button type="button" class="btn" id="xlbtn">📊 Excel আপলোড</button>

  async function addFiles(list) {
    for (const f of list) {
      if (/\.(xlsx|xls|csv)$/i.test(f.name)) { await importExcel(f); continue; }
      if (f.type.startsWith("image/")) files.push(f);

  async function importExcel(f) {
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf);
    const pics = await excelImages(buf).catch(() => ({}));
    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
    // find header row
    // order matters: each column is assigned to the first key it matches
    const keys = {
      product_name: /product|english|item|name|পণ্য/i,
      unit_price_cny: /单价|价格|price|দাম/i,
      carton_no: /箱号|carton|ctn|কার্টন/i,
      notes: /备注|note|নোট/i,
      product_name_cn: /商品名称|商品|品名|产品名称|chinese|title/i,
      color: /颜色|色|colou?r|কালার/i,
      size: /尺码|尺寸|规格|size|সাইজ/i,
      qty: /数量|件数|qty|quantity|pcs|পরিমাণ/i,
    };
    let hi = -1, map = {};
    for (let r = 0; r < Math.min(data.length, 20); r++) {
      const m = {};
      data[r].forEach((c, ci) => { for (const [k, re] of Object.entries(keys)) if (m[k] == null && re.test(String(c))) { m[k] = ci; break; } });
      if (m.qty != null && (m.product_name != null || m.product_name_cn != null || m.size != null)) { hi = r; map = m; break; }
    }
    if (hi < 0) { alert("Excel-এ কলাম চেনা যায়নি — প্রথম শিটে Product, Color, Size, Qty কলাম থাকতে হবে।"); return; }
    let last = "";
    const add = [];
    for (let r = hi + 1; r < data.length; r++) {
      const row = data[r], qty = num(row[map.qty]);
      if (!qty) continue;
      const name = String(row[map.product_name] ?? "").trim() || String(row[map.product_name_cn] ?? "").trim() || last; last = name;
      add.push({ image_url: pics[r] || "", product_name: name, product_name_cn: "", color: String(row[map.color] ?? ""), size: String(row[map.size] ?? ""), qty: Math.round(qty), unit_price_cny: num(row[map.unit_price_cny]), carton_no: String(row[map.carton_no] ?? ""), notes: String(row[map.notes] ?? "") });
    }
    // lot info from an "Info" sheet, if present (made by Claude)
    const info = wb.Sheets["Info"];
    if (info) XLSX.utils.sheet_to_json(info, { header: 1 }).forEach(([k, v]) => {
      const el = { "Supplier": "#supplier", "Order No": "#order_no", "Lot No": "#lot_no", "Tracking No": "#lot_no", "Brand": "#brand", "Notes": "#notes" }[String(k).trim()];
      if (el && v != null && String(v).trim()) main.querySelector(el).value = String(v).trim();
    });
    rows = main.querySelector("#append").checked ? readRows().concat(add) : (readRows().filter(r => r.product_name || r.product_name_cn).concat(add));
    drawRows();
    main.querySelector("#aimsg").textContent = `✅ Excel থেকে ${add.length} লাইন, মোট ${add.reduce((a, r) => a + r.qty, 0)} পিস${add.some(r => r.image_url) ? `, ${add.filter(r => r.image_url).length}টা ছবি` : ""} এসেছে — মিলিয়ে নিয়ে "সেভ করুন" চাপুন। ছবি দিতে প্রতিটা লাইনের 📷 চাপুন।`;
  }

  main.querySelector("#ai").onclick = async (e) => {
    const b = e.target; b.disabled = true;
    const msg = main.querySelector("#aimsg"), warn = main.querySelector("#warn");
    warn.innerHTML = "";
    try {
      msg.textContent = "ছবি তৈরি হচ্ছে…";
      const images = [];
      for (const f of files) images.push(...await sliceImage(f));
      msg.textContent = `AI পড়ছে (${images.length} অংশ)… ২০–৬০ সেকেন্ড লাগতে পারে`;
      const res = await fn("pl-parse-order", { images });
      const add = (res.items || []).map(i => ({ ...i, carton_no: "", notes: "" }));
      rows = main.querySelector("#append").checked ? readRows().concat(add) : add;
      drawRows();
      if (res.supplier && !main.querySelector("#supplier").value) main.querySelector("#supplier").value = res.supplier;
      if (res.order_no && !main.querySelector("#order_no").value) main.querySelector("#order_no").value = res.order_no;
      msg.textContent = `✅ ${add.length} লাইন পাওয়া গেছে — মিলিয়ে দেখুন`;
      if (res.warnings?.length) warn.innerHTML = `<div class="warnbox">⚠️ AI-এর নোট:<br>${res.warnings.map(esc).join("<br>")}</div>`;
    } catch (err) { msg.textContent = ""; warn.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
    b.disabled = false;
  };

  main.querySelector("#add").onclick = () => { rows = readRows(); rows.push({ product_name: "", product_name_cn: "", color: "", size: "", qty: 0, carton_no: "", unit_price_cny: 0, notes: "" }); drawRows(); };
  main.querySelector("#cancel").onclick = () => editing ? go("lot", lot.id) : go("lots");

  main.querySelector("#save").onclick = async (e) => {
    const b = e.target, err = main.querySelector("#err"); err.textContent = "";
    const lotNo = main.querySelector("#lot_no").value.trim();
    const list = readRows().filter(r => r.product_name.trim() || num(r.qty));
    if (!list.length) { err.textContent = "অন্তত একটা লাইন দিন"; return; }
    b.disabled = true;
    try {
      const head = { lot_no: lotNo, brand: isSuper() ? main.querySelector("#brand").value : S.me.brand, supplier: main.querySelector("#supplier").value.trim(), order_no: main.querySelector("#order_no").value.trim(), notes: main.querySelector("#notes").value.trim() };
      let lotId = lot.id;
      if (editing) await q(sb.from("pl_lots").update(head).eq("id", lotId));
      else lotId = (await q(sb.from("pl_lots").insert(head).select("id").single())).id;
      // replace items (costs cascade)
      if (editing) await q(sb.from("pl_lot_items").delete().eq("lot_id", lotId));
      const ins = await q(sb.from("pl_lot_items").insert(list.map((r, n) => ({
        lot_id: lotId, position: n, product_name: r.product_name.trim(), product_name_cn: r.product_name_cn.trim(),
        color: r.color.trim(), size: r.size.trim(), qty: Math.round(num(r.qty)), carton_no: r.carton_no.trim(), notes: r.notes.trim(), image_url: r.image_url || "", received_qty: r.received_qty ?? null, line_type: r.line_type || "ordered" }))).select("id,position"));
      await q(sb.from("pl_item_costs").insert(ins.map(x => ({ item_id: x.id, unit_price_cny: num(list[x.position].unit_price_cny), sell_price_override: list[x.position].sell_price_override }))));
      go("lot", lotId);
    } catch (ex) { err.textContent = ex.message; b.disabled = false; }
  };
}

// ---------- receiving (BD) ----------
function rcvStats(lot, items) {
  const ord = items.filter(i => i.line_type !== "extra"), ext = items.filter(i => i.line_type === "extra");
  const received = items.reduce((a, i) => a + (i.received_qty ?? 0), 0);
  const short = ord.reduce((a, i) => a + Math.max(0, i.qty - (i.received_qty ?? 0)), 0);
  const extra = ord.reduce((a, i) => a + Math.max(0, (i.received_qty ?? 0) - i.qty), 0) + ext.reduce((a, i) => a + (i.received_qty || 0), 0);
  return { done: !!lot.received_at, received, short, extra, extraLines: ext.length };
}
function diffHtml(i) {
  const d = i.line_type === "extra" ? (i.received_qty || 0) : (i.received_qty ?? 0) - i.qty;
  return d === 0 ? `<span class="rb ok">✓</span>` : d < 0 ? `<span class="rb bad">${d}</span>` : `<span class="rb more">+${d}</span>`;
}

    <div class="tw"><table class="edit" id="rt">

  const summ = () => {

    try { await q(sb.rpc("pl_save_receive", { p_lot: lot.id, p_items: its, p_extras: xs, p_mark_arrived: main.querySelector("#arr").checked })); S.lotTab = "pl"; go("lot"); }
    catch (ex) { err.textContent = ex.message; b.disabled = false; }
  };
}

// Excel-এর প্রথম শিটে বসানো ছবি পড়া: { সারি নম্বর (0 থেকে): ছবি }
async function excelImages(buf) {
  if (!window.JSZip) return {};
  const zip = await JSZip.loadAsync(buf);
  const P = new DOMParser(), xml = async (p) => { const f = zip.file(p); return f ? P.parseFromString(await f.async("text"), "application/xml") : null; };
  const tags = (doc, n) => doc ? [...doc.getElementsByTagNameNS("*", n)] : [];
  const RNS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const rattr = (el, n) => el.getAttributeNS(RNS, n) || el.getAttribute("r:" + n);
  const resolve = (base, t) => { if (t.startsWith("/")) return t.slice(1); const parts = base.split("/").slice(0, -1); t.split("/").forEach(x => x === ".." ? parts.pop() : x !== "." && parts.push(x)); return parts.join("/"); };
  const relsOf = (p) => p.replace(/([^/]+)$/, "_rels/$1.rels");
  const wbx = await xml("xl/workbook.xml"), wbr = await xml("xl/_rels/workbook.xml.rels");
  const rid = rattr(tags(wbx, "sheet")[0], "id");
  const sheetRel = tags(wbr, "Relationship").find(r => r.getAttribute("Id") === rid); if (!sheetRel) return {};
  const sheetPath = resolve("xl/workbook.xml", sheetRel.getAttribute("Target"));
  const drel = tags(await xml(relsOf(sheetPath)), "Relationship").find(r => /\/drawing$/.test(r.getAttribute("Type"))); if (!drel) return {};
  const drawPath = resolve(sheetPath, drel.getAttribute("Target"));
  const dx = await xml(drawPath), media = {};
  tags(await xml(relsOf(drawPath)), "Relationship").forEach(r => media[r.getAttribute("Id")] = resolve(drawPath, r.getAttribute("Target")));
  const out = {};
  for (const a of [...tags(dx, "twoCellAnchor"), ...tags(dx, "oneCellAnchor")]) {
    const from = tags(a, "from")[0], blip = tags(a, "blip")[0]; if (!from || !blip) continue;
    const row = +tags(from, "row")[0].textContent; if (out[row]) continue;
    const path = media[rattr(blip, "embed")], file = path && zip.file(path); if (!file) continue;
    const ext = path.split(".").pop().toLowerCase();
    out[row] = await thumbData(new Blob([await file.async("uint8array")], { type: ext === "png" ? "image/png" : ext === "gif" ? "image/gif" : "image/jpeg" }));
  }
  return out;
}

// small product photo -> JPEG data URL (max 300px)
async function thumbData(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, 300 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.82);
}
// click a product photo to see it big
document.addEventListener("click", (e) => {
  const im = e.target.closest("img.pimg"); if (!im || im.dataset.pick) return;
  const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${im.src}" alt="">`;
  lb.onclick = () => lb.remove(); document.body.appendChild(lb);
});

// Resize + cut tall screenshots into readable slices
async function sliceImage(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const W = Math.min(img.width, 1100), scale = W / img.width, H = Math.round(img.height * scale);
  const SL = 1500, OV = 120, out = [];
  for (let y = 0; y < H; y += SL - OV) {
    const h = Math.min(SL, H - y);
    const c = document.createElement("canvas"); c.width = W; c.height = h;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, h);
    ctx.drawImage(img, 0, -y, W, H);
    out.push({ media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] });
    if (y + h >= H) break;
  }
  return out;
}

<script>
/* পাসওয়ার্ড দেখান/লুকান — সব পাসওয়ার্ড ঘরে নিজে থেকেই যোগ হয় */
(function(){
  function add(inp){
    if (inp.dataset.pwtog) return; inp.dataset.pwtog = "1";
    const w = document.createElement("span"); w.className = "pwwrap";
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const t = document.createElement("span"); t.className = "pwtog"; t.setAttribute("role","button"); t.tabIndex = 0;
    t.textContent = "👁 দেখুন";
    const flip = () => { const show = inp.type === "password"; inp.type = show ? "text" : "password"; t.textContent = show ? "🙈 লুকান" : "👁 দেখুন"; };
    t.addEventListener("click", flip);
    t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    w.appendChild(t);
  }
  const scan = () => document.querySelectorAll('input[type="password"]').forEach(add);
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener("DOMContentLoaded", scan); scan();
})();
</script>
